    //para el json
    function predictIntent(message) {
    message = message.toLowerCase();
    let bestMatchIndex = -1;

    for (let i = 0; i < intents.length; i++) {
        const intent = intents[i];
        for (let j = 0; j < intent.patterns.length; j++) {
            const pattern = intent.patterns[j].toLowerCase();
            
           
            if (message === pattern) {
                bestMatchIndex = i;
                break; 
            }
        }

        if (bestMatchIndex !== -1) {
            break; 
        }
    }

    if (bestMatchIndex !== -1) {
        return intents[bestMatchIndex].tag;
    } else {
        return "intencion_desconocida";
    }
}


    function getResponse(intent) {
    for (let i = 0; i < intents.length; i++) {
        const item = intents[i];
        if ('tag' in item && item.tag === intent) {
            const responses = item.responses;
            const response = responses[Math.floor(Math.random() * responses.length)];

            if (typeof response === 'object' && 'text' in response && 'link_url' in response) {
                return {
                    text: response.text,
                    link_url: response.link_url
                };
            } else {
                return response;
            }
        }
    }

    return "No estoy seguro de entender. ¿Puedes reformular tu pregunta?";
}


function addMessage(sender, message) {
    const chatBox = document.getElementById("chat-box");
    const messageDiv = document.createElement("div");
    messageDiv.className = sender + "-message";

    if (typeof message === 'object' && 'text' in message && 'link_url' in message) {
        const link = document.createElement("a");
        link.href = message.link_url;
        link.textContent = sender === "user" ? "Tú: Link" : "Nodie: Link";
        link.target = "_blank";

        const text = document.createElement("p");
        text.textContent = sender === "user" ? "Tú: " + message.text : "Nodie: " + message.text;

        messageDiv.appendChild(text);
        messageDiv.appendChild(link);
    } else if (message.startsWith("data:image")) {
        const image = document.createElement("img");
        image.src = message;
        messageDiv.appendChild(image);
    } else {
        messageDiv.textContent = sender === "user" ? "Tú: " + message : "Nodie : " + message;
    }

    chatBox.appendChild(messageDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
}



    function sendMessage() {
        const userMessage = document.getElementById("user-message").value;
        addMessage("user", userMessage);
        document.getElementById("user-message").value = "";

        //predixion
        const intent = predictIntent(userMessage);

        
        const botResponse = getResponse(intent);

        
        addMessage("bot", botResponse);
    }

    let isChatOpen = false;

    function toggleChat() {
        const chatContainer = document.getElementById("chat-container");
        const chatIcon = document.querySelector(".chat-icon");

        if (!isChatOpen) {
            chatContainer.style.display = 'block';
            chatIcon.style.transform = 'rotate(45deg)';
        } else {
            chatContainer.style.display = 'none';
            chatIcon.style.transform = '';
        }

        isChatOpen = !isChatOpen;
    }

    
   
    
    function similarText(first, second) {
        first = first || '';
        second = second || '';
        let pos1 = 0,
            pos2 = 0,
            max = 0,
            firstLength = first.length,
            secondLength = second.length,
            p, q, l, sum;

        for (p = 0; p < firstLength; p++) {
            for (q = 0; q < secondLength; q++) {
                for (l = 0;
                    (p + l < firstLength) && (q + l < secondLength) && (first.charAt(p + l) === second.charAt(q + l)); l++);
                if (1 > max) {
                    max = 1;
                    pos1 = p;
                    pos2 = q;
                }
            }
        }

        sum = max;

        if (sum) {
            if (pos1 && pos2) {
                sum += similarText(first.substr(0, pos2), second.substr(0, pos2));
            }

            if ((pos1 + max < firstLength) && (pos2 + max < secondLength)) {
                sum += similarText(first.substr(pos1 + max, firstLength - pos1 - max), second.substr(pos2 + max, secondLength - pos2 - max));
            }
        }

        return sum;
    }
